<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nscale Bar</title>
<style>
:root{
  --base:#040E27; --s1:#081634; --s2:#0C1D44; --s3:#12285A; --line:#1E2D55; --line2:#2A3B68;
  --text:#FDFFF8; --muted:#C0C3C9; --dim:#828793; --signal:#0F41F3; --signal2:#3F68FF; --mint:#00DF99; --warn:#FF9A3C;
  --sans:'DM Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'DM Mono', ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--base);color:var(--text);font:500 12.5px var(--sans);overflow:hidden;user-select:none}
.bar{display:flex;align-items:center;gap:6px;height:100%;padding:0 8px}
.b{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:linear-gradient(180deg,var(--s2),var(--s1));color:var(--text);font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);white-space:nowrap}
.b:hover{border-color:var(--line2);background:var(--s3)}
.b svg{width:15px;height:15px;color:var(--signal2);flex:none}
.b.ghost{background:none;border-color:transparent;color:var(--dim)}
.b.ghost:hover{color:var(--text);background:rgba(255,255,255,.04)}
.sp{flex:1}
.st{display:flex;align-items:center;gap:7px;font:400 11.5px var(--sans);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.st.ok i{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.st.warn i{background:var(--warn)}
:focus-visible{outline:2px solid var(--signal2);outline-offset:2px}
</style>
</head>
<body>
<div class="bar">
  <button class="b" data-a="null" title="Null at the centre of the selected layers">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Null
  </button>
  <button class="b" data-a="anchor" data-p='{"pos":"c"}' title="Anchor point to the centre of the selected layers">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="3"/><path d="M12 8v13M5 12H2a10 10 0 0 0 20 0h-3"/></svg>Anchor
  </button>
  <button class="b" data-a="clone" data-p='{"kind":"simple","count":3}' title="Cloner: duplicate the selection in a row">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Clone
  </button>
  <span class="sp"></span>
  <div class="st" id="status"><i></i><span id="statusTxt">Nscale Bar</span></div>
  <button class="b ghost" id="openPanel" title="Open the full Nscale Motion panel">Panel</button>
</div>
<script>
const CEP = window.__adobe_cep__;
function status(msg, kind) { document.getElementById('statusTxt').textContent = msg; document.getElementById('status').className = 'st' + (kind ? ' ' + kind : ''); }
function run(action, payload) {
  if (!CEP) { status(action + ' (needs After Effects)'); return; }
  status('Working…');
  CEP.evalScript('nsm_run(' + JSON.stringify(action) + ',' + JSON.stringify(payload || {}) + ')', res => {
    res = String(res || '');
    const i = res.indexOf(':'), kind = res.slice(0, i), body = res.slice(i + 1);
    status(body || res, (kind === 'WARN' || res === 'EvalScript error.') ? 'warn' : 'ok');
  });
}
document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => run(b.dataset.a, b.dataset.p ? JSON.parse(b.dataset.p) : {}));
document.getElementById('openPanel').onclick = () => { if (CEP) CEP.requestOpenExtension('com.nscale.motion', ''); };
if (CEP) CEP.evalScript('nsm_ping()', r => { r = String(r || ''); status(r.indexOf('OK:') === 0 ? r.slice(3) : 'Host script did not load — reinstall.', r.indexOf('OK:') === 0 ? 'ok' : 'warn'); });
</script>
</body>
</html>
